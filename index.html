<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>Multi Viewer</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#07080a;
      --panel:#0d0f13;
      --panel2:#12151a;
      --line:rgba(255,255,255,.10);
      --line2:rgba(255,255,255,.18);
      --text:#f3f5f7;
      --muted:#90969f;
      --accent:#f2a3ab;
      --accent-soft:rgba(242,163,171,.18);
      --shadow:0 24px 90px rgba(0,0,0,.52);
      --gap-y:4px;
      --gap-x:7.111111px;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    button,input{font:inherit}
    button{color:inherit}

    body{
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 0%,rgba(255,255,255,.035),transparent 34%),
        #07080a;
    }

    .stage{
      position:relative;
      width:min(100vw,calc(100vh * 16 / 9));
      height:min(100vh,calc(100vw * 9 / 16));
      aspect-ratio:16/9;
    }

    .grid{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-template-rows:minmax(0,1fr) minmax(0,1fr);
      column-gap:var(--gap-x);
      row-gap:var(--gap-y);
    }

    .pane{
      position:relative;
      overflow:hidden;
      background:#020303;
      border:1px solid rgba(255,255,255,.075);
      border-radius:8px;
      aspect-ratio:16/9;
      isolation:isolate;
      transition:border-color .16s ease,box-shadow .16s ease;
    }
    .pane.audio-live{
      border-color:var(--accent);
      box-shadow:inset 0 0 0 1px rgba(242,163,171,.12),0 0 18px rgba(242,163,171,.12);
    }
    .pane.crop-active{
      z-index:30;
      border-color:rgba(255,255,255,.36);
      box-shadow:0 0 0 2px rgba(255,255,255,.08),0 18px 60px rgba(0,0,0,.42);
    }

    .source{
      position:absolute;
      inset:0;
      transform-origin:center center;
      will-change:transform;
      background:#000;
    }
    .source iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#000;
    }

    .empty{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 42%),
        #050608;
    }
    .empty-inner{text-align:center;color:#767c84}
    .empty-plus{
      width:52px;height:52px;margin:0 auto 10px;border-radius:50%;
      border:1px solid rgba(255,255,255,.13);display:grid;place-items:center;
      font-size:28px;font-weight:250;color:#b8bdc3;background:rgba(255,255,255,.035);
    }
    .empty-text{font-size:11px;font-weight:650;letter-spacing:.02em}

    .audio-button{
      position:absolute;
      z-index:12;
      left:9px;
      bottom:9px;
      width:30px;
      height:30px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:8px;
      display:grid;
      place-items:center;
      background:rgba(8,9,11,.70);
      backdrop-filter:blur(12px);
      color:#d8dce0;
      cursor:pointer;
      opacity:0;
      transform:translateY(3px);
      transition:.16s ease;
    }
    .pane:hover .audio-button,.pane.audio-live .audio-button{opacity:1;transform:none}
    .audio-live .audio-button{
      color:#ffd9dd;
      border-color:rgba(242,163,171,.34);
      background:rgba(49,24,28,.64);
    }
    .audio-button:hover{background:rgba(30,33,38,.92)}
    .audio-button svg{width:15px;height:15px}

    .hover-tools{
      position:absolute;
      z-index:12;
      top:8px;
      right:8px;
      display:flex;
      gap:5px;
      opacity:0;
      transform:translateY(-3px);
      pointer-events:none;
      transition:.16s ease;
    }
    .pane:hover .hover-tools{opacity:1;transform:none;pointer-events:auto}
    .hover-tool{
      height:29px;
      padding:0 9px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:8px;
      background:rgba(8,9,11,.72);
      backdrop-filter:blur(12px);
      color:#cdd1d6;
      font-size:10px;
      font-weight:700;
      cursor:pointer;
    }
    .hover-tool:hover{background:rgba(30,33,38,.94);border-color:rgba(255,255,255,.19)}

    .crop-layer{
      display:none;
      position:absolute;
      inset:0;
      z-index:20;
      cursor:grab;
      touch-action:none;
      background:rgba(255,255,255,.008);
    }
    .crop-active .crop-layer{display:block}
    .crop-layer.dragging{cursor:grabbing}
    .crop-hud{
      display:none;
      position:absolute;
      z-index:24;
      left:50%;
      bottom:11px;
      transform:translateX(-50%);
      align-items:center;
      gap:7px;
      padding:6px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:10px;
      background:rgba(8,9,11,.82);
      backdrop-filter:blur(14px);
      box-shadow:0 12px 35px rgba(0,0,0,.28);
      white-space:nowrap;
    }
    .crop-active .crop-hud{display:flex}
    .crop-hud span{font-size:10px;color:#a9afb7;padding:0 5px}
    .crop-hud button{
      height:28px;border:1px solid rgba(255,255,255,.10);border-radius:7px;
      background:rgba(255,255,255,.05);padding:0 9px;cursor:pointer;
      font-size:10px;font-weight:700;color:#d5d9de;
    }
    .crop-hud button:hover{background:rgba(255,255,255,.09)}
    .crop-zoom{
      position:absolute;
      z-index:24;
      top:10px;
      left:10px;
      display:none;
      padding:6px 8px;
      border-radius:8px;
      background:rgba(8,9,11,.78);
      border:1px solid rgba(255,255,255,.11);
      backdrop-filter:blur(12px);
      font-size:10px;
      font-weight:700;
      color:#bcc2c9;
      pointer-events:none;
    }
    .crop-active .crop-zoom{display:block}

    .gear{
      position:fixed;
      z-index:100;
      top:12px;
      right:12px;
      width:38px;height:38px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.13);
      background:rgba(12,14,18,.84);
      backdrop-filter:blur(16px);
      display:grid;place-items:center;
      color:#d8dce1;
      cursor:pointer;
      box-shadow:0 10px 32px rgba(0,0,0,.28);
      opacity:0;
      transform:translateY(-7px) scale(.96);
      pointer-events:none;
      transition:.18s ease;
    }
    .gear.visible{opacity:1;transform:none;pointer-events:auto}
    .gear:hover{background:rgba(30,33,39,.94);border-color:rgba(255,255,255,.22)}
    .gear svg{width:18px;height:18px}

    .settings{
      position:fixed;
      z-index:110;
      top:58px;
      right:12px;
      width:min(460px,calc(100vw - 24px));
      max-height:calc(100vh - 72px);
      overflow:auto;
      padding:12px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:14px;
      background:rgba(13,15,19,.94);
      backdrop-filter:blur(22px);
      box-shadow:var(--shadow);
      opacity:0;
      transform:translateY(-7px) scale(.985);
      pointer-events:none;
      transition:.18s ease;
    }
    .settings.open{opacity:1;transform:none;pointer-events:auto}
    .settings-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:2px 3px 11px;
    }
    .settings-title{font-size:13px;font-weight:760;letter-spacing:-.01em}
    .settings-hint{font-size:10px;color:#727983}
    .slot{
      padding:10px;
      border:1px solid rgba(255,255,255,.085);
      border-radius:11px;
      background:rgba(255,255,255,.025);
    }
    .slot + .slot{margin-top:8px}
    .slot-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .slot-title{font-size:11px;font-weight:740;color:#d8dce1}
    .slot-status{font-size:9px;color:#737a84}
    .url-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
    .url{
      min-width:0;
      height:36px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:8px;
      outline:none;
      padding:0 10px;
      background:#080a0d;
      color:#f1f3f5;
      font-size:11px;
    }
    .url:focus{border-color:rgba(242,163,171,.48);box-shadow:0 0 0 3px rgba(242,163,171,.07)}
    .apply,.crop-btn,.clear-btn{
      height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.11);
      background:rgba(255,255,255,.05);padding:0 11px;
      cursor:pointer;font-size:10px;font-weight:720;color:#d9dde1;
    }
    .apply{background:#eef0f2;color:#0d0f12;border-color:#eef0f2}
    .apply:hover{background:white}
    .slot-actions{display:flex;gap:7px;margin-top:7px}
    .crop-btn{flex:1}
    .crop-btn:hover,.clear-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18)}
    .clear-btn{color:#e4aeb4}
    .settings-note{
      padding:10px 3px 2px;
      color:#777e87;
      font-size:9px;
      line-height:1.45;
    }

    .toast{
      position:fixed;z-index:160;left:50%;bottom:16px;transform:translate(-50%,12px);
      padding:8px 11px;border:1px solid rgba(255,255,255,.12);border-radius:8px;
      background:rgba(14,16,20,.92);backdrop-filter:blur(14px);
      color:#d4d8dd;font-size:10px;font-weight:680;
      opacity:0;pointer-events:none;transition:.18s ease;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:700px){
      .pane{border-radius:5px}
      .settings{top:55px}
      .hover-tool{padding:0 7px}
      .crop-hud span{display:none}
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="grid" id="grid" aria-label="Four-view multiviewer"></section>
  </main>

  <button class="gear" id="gear" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63 1.7 1.7 0 0 0 10 3.08V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9 1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/>
    </svg>
  </button>

  <aside class="settings" id="settings" aria-label="Multiview settings">
    <div class="settings-head">
      <div>
        <div class="settings-title">Multi Viewer</div>
        <div class="settings-hint">double-tap Shift to hide/show this control</div>
      </div>
    </div>
    <div id="slots"></div>
    <div class="settings-note">
      Crop & Fit edits the live pane itself: drag to pan, use the mouse wheel to zoom, and press Esc when finished. The iframe is never handed off to another preview, so it stays live.
    </div>
  </aside>

  <div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'multi-viewer-v3';
  const blank = () => ({url:'',embed:'',type:'generic',title:'',x:0,y:0,scale:1});

  const state = {
    panes:[blank(),blank(),blank(),blank()],
    audioIndex:null,
    cropIndex:null,
    gearVisible:false
  };

  const grid = document.getElementById('grid');
  const gear = document.getElementById('gear');
  const settings = document.getElementById('settings');
  const slots = document.getElementById('slots');
  const toastEl = document.getElementById('toast');

  const frames = new Array(4).fill(null);
  let shiftAt = 0;
  let toastTimer = null;
  let drag = null;

  const speaker = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 10v4h4l5 4V6l-5 4H5Z"/><path d="M17 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></svg>';

  function load(){
    try{
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(saved && Array.isArray(saved.panes) && saved.panes.length === 4){
        state.panes = saved.panes.map(p => ({
          ...blank(),
          ...p,
          x:Number(p.x)||0,
          y:Number(p.y)||0,
          scale:Math.min(4,Math.max(.35,Number(p.scale)||1))
        }));
        state.audioIndex = Number.isInteger(saved.audioIndex) ? saved.audioIndex : null;
      }
    }catch(_){}
  }

  function save(){
    try{
      localStorage.setItem(KEY,JSON.stringify({
        panes:state.panes,
        audioIndex:state.audioIndex
      }));
    }catch(_){}
  }

  function toast(msg){
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'),1500);
  }

  function escapeHtml(v){
    return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function normalize(raw){
    let value=(raw||'').trim();
    if(!value) return blank();
    if(!/^https?:\/\//i.test(value)) value='https://'+value;
    let u;
    try{u=new URL(value)}catch(_){return null}
    const host=u.hostname.replace(/^www\./,'').toLowerCase();

    if(host==='youtube.com'||host.endsWith('.youtube.com')||host==='youtu.be'){
      let id='';
      if(host==='youtu.be') id=u.pathname.split('/').filter(Boolean)[0]||'';
      if(!id&&u.pathname==='/watch') id=u.searchParams.get('v')||'';
      if(!id&&/^\/(embed|shorts|live)\//.test(u.pathname)) id=u.pathname.split('/')[2]||'';
      if(id){
        id=id.replace(/[^a-zA-Z0-9_-]/g,'');
        const params=new URLSearchParams({
          autoplay:'1',mute:'1',controls:'1',playsinline:'1',rel:'0',enablejsapi:'1',origin:location.origin
        });
        return {url:value,embed:'https://www.youtube.com/embed/'+id+'?'+params,title:'YouTube',type:'youtube'};
      }
    }

    if(host==='twitch.tv'||host.endsWith('.twitch.tv')){
      const parts=u.pathname.split('/').filter(Boolean);
      const parent=location.hostname||'localhost';
      let src='';
      let title='Twitch';
      if(parts[0]==='videos'&&parts[1]){
        src='https://player.twitch.tv/?video='+encodeURIComponent(parts[1])+'&parent='+encodeURIComponent(parent)+'&autoplay=true&muted=true';
      }else if(host==='clips.twitch.tv'&&parts[0]){
        src='https://clips.twitch.tv/embed?clip='+encodeURIComponent(parts[0])+'&parent='+encodeURIComponent(parent)+'&autoplay=true&muted=true';
      }else if(parts[0]){
        src='https://player.twitch.tv/?channel='+encodeURIComponent(parts[0])+'&parent='+encodeURIComponent(parent)+'&autoplay=true&muted=true';
        title='Twitch · '+parts[0];
      }
      if(src) return {url:value,embed:src,title,type:'twitch'};
    }

    return {
      url:value,
      embed:value,
      title:host,
      type:'generic'
    };
  }

  function build(){
    grid.innerHTML='';
    for(let i=0;i<4;i++){
      const pane=document.createElement('article');
      pane.className='pane';
      pane.dataset.index=i;

      const source=document.createElement('div');
      source.className='source';
      source.dataset.source=i;
      pane.appendChild(source);

      const empty=document.createElement('div');
      empty.className='empty';
      empty.innerHTML='<div class="empty-inner"><div class="empty-plus">+</div><div class="empty-text">Set Pane '+(i+1)+' URL in settings</div></div>';
      pane.appendChild(empty);

      const audio=document.createElement('button');
      audio.className='audio-button';
      audio.dataset.audio=i;
      audio.title='Use audio from pane '+(i+1);
      audio.innerHTML=speaker;
      pane.appendChild(audio);

      const hover=document.createElement('div');
      hover.className='hover-tools';
      hover.innerHTML='<button class="hover-tool" data-crop="'+i+'">Crop & Fit</button>';
      pane.appendChild(hover);

      const cropLayer=document.createElement('div');
      cropLayer.className='crop-layer';
      cropLayer.dataset.cropLayer=i;
      pane.appendChild(cropLayer);

      const zoom=document.createElement('div');
      zoom.className='crop-zoom';
      zoom.dataset.zoom=i;
      pane.appendChild(zoom);

      const hud=document.createElement('div');
      hud.className='crop-hud';
      hud.innerHTML='<span>Drag / arrows = 1px · Shift+arrows = 10px · wheel = zoom · Esc = finish</span><button data-fit="'+i+'">Fit</button><button data-reset="'+i+'">Reset</button>';
      pane.appendChild(hud);

      grid.appendChild(pane);

      if(state.panes[i].embed) mountFrame(i);
      applyTransform(i);
      updatePaneChrome(i);
    }
    renderSlots();
    syncAudio();
  }

  function mountFrame(i){
    const p=state.panes[i];
    const source=document.querySelector('[data-source="'+i+'"]');
    if(!source) return;

    source.innerHTML='';
    const frame=document.createElement('iframe');
    frame.className='pane-frame';
    frame.title='Pane '+(i+1);
    frame.src=p.embed;
    frame.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';
    frame.setAttribute('allowfullscreen','');
    frame.referrerPolicy='strict-origin-when-cross-origin';
    source.appendChild(frame);
    frames[i]=frame;

    frame.addEventListener('load',()=>{
      // Re-assert audio state after every load/navigation for supported players.
      setTimeout(syncAudio,80);
      setTimeout(syncAudio,350);
      setTimeout(syncAudio,1000);

      // Same-origin pages can expose their current URL; cross-origin pages intentionally cannot.
      try{
        const href=frame.contentWindow.location.href;
        if(href && href!=='about:blank'){
          state.panes[i].url=href;
          const input=document.querySelector('[data-url="'+i+'"]');
          if(input) input.value=href;
          save();
        }
      }catch(_){}
      if(state.panes[i].type==='youtube') {
        setTimeout(syncAudio,1600);
        setTimeout(syncAudio,2800);
      }
    });
  }

  function updatePaneChrome(i){
    const pane=document.querySelector('.pane[data-index="'+i+'"]');
    if(!pane) return;
    const p=state.panes[i];
    pane.classList.toggle('audio-live',state.audioIndex===i&&!!p.embed);
    pane.classList.toggle('crop-active',state.cropIndex===i);
    const empty=pane.querySelector('.empty');
    if(empty) empty.style.display=p.embed?'none':'grid';
    const audio=pane.querySelector('.audio-button');
    if(audio) audio.style.display=p.embed?'grid':'none';
    const crop=pane.querySelector('[data-crop]');
    if(crop) crop.style.display=p.embed?'block':'none';
    const zoom=pane.querySelector('[data-zoom="'+i+'"]');
    if(zoom) zoom.textContent=Math.round(p.scale*100)+'%';
  }

  function renderSlots(){
    slots.innerHTML='';
    state.panes.forEach((p,i)=>{
      const row=document.createElement('section');
      row.className='slot';
      row.innerHTML=
        '<div class="slot-head">'+
          '<div class="slot-title">Pane '+(i+1)+'</div>'+
          '<div class="slot-status">'+(p.embed?escapeHtml(p.title||'Loaded'):'Empty')+'</div>'+
        '</div>'+
        '<div class="url-row">'+
          '<input class="url" data-url="'+i+'" type="url" inputmode="url" autocomplete="off" placeholder="Paste a URL…" value="'+escapeHtml(p.url)+'">'+
          '<button class="apply" data-apply="'+i+'">Load</button>'+
        '</div>'+
        '<div class="slot-actions">'+
          '<button class="crop-btn" data-settings-crop="'+i+'" '+(p.embed?'':'disabled')+'>Crop & Fit</button>'+
          '<button class="clear-btn" data-clear="'+i+'" '+(p.embed?'':'disabled')+'>Clear</button>'+
        '</div>';
      slots.appendChild(row);
    });
  }

  function setPaneUrl(i,raw){
    const data=normalize(raw);
    if(!data){toast('Enter a valid URL');return}
    if(!data.embed){
      state.panes[i]=blank();
      frames[i]=null;
      save();
      build();
      return;
    }

    const old=state.panes[i];
    state.panes[i]={...blank(),...data,x:old.x||0,y:old.y||0,scale:old.scale||1};
    save();

    const source=document.querySelector('[data-source="'+i+'"]');
    if(source){
      mountFrame(i);
      applyTransform(i);
      updatePaneChrome(i);
      renderSlots();
      if(state.audioIndex==null){
        state.audioIndex=i;
        save();
      }
      syncAudio();
    }else{
      build();
    }
  }

  function clearPane(i){
    if(state.cropIndex===i) exitCrop();
    state.panes[i]=blank();
    frames[i]=null;
    if(state.audioIndex===i) state.audioIndex=null;
    save();
    build();
  }

  function applyTransform(i){
    const p=state.panes[i];
    const source=document.querySelector('[data-source="'+i+'"]');
    if(!source) return;
    source.style.width='';
    source.style.height='';
    source.style.marginLeft='';
    source.style.marginTop='';
    source.style.transform='translate('+p.x+'px,'+p.y+'px) scale('+p.scale+')';
    const zoom=document.querySelector('[data-zoom="'+i+'"]');
    if(zoom) zoom.textContent=Math.round(p.scale*100)+'%';
  }

  function enterCrop(i){
    if(!state.panes[i].embed) return;
    state.cropIndex=i;
    settings.classList.remove('open');
    for(let n=0;n<4;n++) updatePaneChrome(n);
    toast('Crop mode · arrows nudge 1px · Shift+arrows 10px');
  }

  function exitCrop(){
    if(state.cropIndex==null) return;
    state.cropIndex=null;
    drag=null;
    save();
    for(let n=0;n<4;n++) updatePaneChrome(n);
  }

  function fitPane(i){
    state.panes[i].x=0;
    state.panes[i].y=0;
    state.panes[i].scale=1;
    applyTransform(i);
    save();
  }

  function resetPane(i){ fitPane(i); }

  function setAudio(i){
    if(!state.panes[i].embed) return;
    state.audioIndex=i;
    save();
    for(let n=0;n<4;n++) updatePaneChrome(n);
    syncAudio();
  }

  function postYT(frame,func){
    if(!frame) return;
    const msg=JSON.stringify({event:'command',func,args:[]});
    [0,80,220,600].forEach(delay=>setTimeout(()=>{
      try{frame.contentWindow.postMessage(msg,'https://www.youtube.com')}catch(_){
        try{frame.contentWindow.postMessage(msg,'*')}catch(__){}
      }
    },delay));
  }

  function syncAudio(){
    state.panes.forEach((p,i)=>{
      const frame=frames[i];
      if(!frame||!p.embed) return;
      const on=state.audioIndex===i;

      if(p.type==='youtube'){
        postYT(frame,on?'unMute':'mute');
      }else if(p.type==='twitch'){
        // Twitch is reloaded only when its audio state actually needs to change.
        try{
          const u=new URL(frame.src);
          const desired=on?'false':'true';
          if(u.searchParams.get('muted')!==desired){
            u.searchParams.set('muted',desired);
            frame.src=u.toString();
          }
        }catch(_){}
      }
    });
  }

  gear.addEventListener('click',()=>{
    settings.classList.toggle('open');
  });

  slots.addEventListener('click',e=>{
    const apply=e.target.closest('[data-apply]');
    if(apply){
      const i=Number(apply.dataset.apply);
      const input=document.querySelector('[data-url="'+i+'"]');
      setPaneUrl(i,input.value);
      return;
    }

    const crop=e.target.closest('[data-settings-crop]');
    if(crop){enterCrop(Number(crop.dataset.settingsCrop));return}

    const clear=e.target.closest('[data-clear]');
    if(clear){clearPane(Number(clear.dataset.clear));return}
  });

  slots.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.matches('[data-url]')){
      e.preventDefault();
      setPaneUrl(Number(e.target.dataset.url),e.target.value);
    }
  });

  grid.addEventListener('click',e=>{
    const audio=e.target.closest('[data-audio]');
    if(audio){e.preventDefault();e.stopPropagation();setAudio(Number(audio.dataset.audio));return}

    const crop=e.target.closest('[data-crop]');
    if(crop){e.preventDefault();e.stopPropagation();enterCrop(Number(crop.dataset.crop));return}

    const fit=e.target.closest('[data-fit]');
    if(fit){e.preventDefault();e.stopPropagation();fitPane(Number(fit.dataset.fit));return}

    const reset=e.target.closest('[data-reset]');
    if(reset){e.preventDefault();e.stopPropagation();resetPane(Number(reset.dataset.reset));return}
  });

  grid.addEventListener('pointerdown',e=>{
    const layer=e.target.closest('[data-crop-layer]');
    if(!layer) return;
    const i=Number(layer.dataset.cropLayer);
    if(state.cropIndex!==i) return;

    const p=state.panes[i];
    drag={i,startX:e.clientX,startY:e.clientY,x:p.x,y:p.y};
    layer.classList.add('dragging');
    layer.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  grid.addEventListener('pointermove',e=>{
    if(!drag) return;
    const p=state.panes[drag.i];
    p.x=drag.x+(e.clientX-drag.startX);
    p.y=drag.y+(e.clientY-drag.startY);
    applyTransform(drag.i);
  });

  grid.addEventListener('pointerup',e=>{
    if(!drag) return;
    const layer=document.querySelector('[data-crop-layer="'+drag.i+'"]');
    layer?.classList.remove('dragging');
    drag=null;
    save();
  });

  grid.addEventListener('wheel',e=>{
    const layer=e.target.closest('[data-crop-layer]');
    if(!layer) return;
    const i=Number(layer.dataset.cropLayer);
    if(state.cropIndex!==i) return;
    e.preventDefault();

    const p=state.panes[i];
    const pane=layer.closest('.pane');
    const rect=pane.getBoundingClientRect();
    const px=e.clientX-(rect.left+rect.width/2);
    const py=e.clientY-(rect.top+rect.height/2);

    const old=p.scale;
    const factor=e.deltaY<0?1.08:1/1.08;
    const next=Math.min(4,Math.max(.35,old*factor));
    const ratio=next/old;

    p.x=px-(px-p.x)*ratio;
    p.y=py-(py-p.y)*ratio;
    p.scale=next;
    applyTransform(i);
    save();
  },{passive:false});

  document.addEventListener('keydown',e=>{
    if(e.key==='Shift'){
      const now=performance.now();
      if(now-shiftAt<430){
        state.gearVisible=!state.gearVisible;
        gear.classList.toggle('visible',state.gearVisible);
        if(!state.gearVisible) settings.classList.remove('open');
        shiftAt=0;
      }else{
        shiftAt=now;
      }
      return;
    }

    if(state.cropIndex!=null && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
      e.preventDefault();
      const p=state.panes[state.cropIndex];
      const step=e.shiftKey?10:1;
      if(e.key==='ArrowLeft') p.x-=step;
      if(e.key==='ArrowRight') p.x+=step;
      if(e.key==='ArrowUp') p.y-=step;
      if(e.key==='ArrowDown') p.y+=step;
      applyTransform(state.cropIndex);
      save();
      return;
    }

    if(e.key==='Escape'){
      if(state.cropIndex!=null){
        e.preventDefault();
        exitCrop();
        return;
      }
      if(settings.classList.contains('open')){
        settings.classList.remove('open');
      }
    }
  },true);

  document.addEventListener('click',e=>{
    if(settings.classList.contains('open')&&!settings.contains(e.target)&&!gear.contains(e.target)){
      settings.classList.remove('open');
    }
  });

  load();
  build();
})();
</script>
</body>
</html>
